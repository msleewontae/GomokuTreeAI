<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaGomoku - ONNX MCTS Engine</title>

  <!-- 1. ONNX Runtime Web CDN (필수) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: #1e2022; color: #f0f2f5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 1.8rem; color: #4dabf7; }
    .subtitle { margin-bottom: 20px; font-size: 0.95rem; color: #a0a6b0; }
    .status-panel {
      background: #2b2d31; padding: 12px 24px; border-radius: 8px;
      margin-bottom: 16px; font-weight: 600; display: flex; gap: 20px;
    }
    .status-item span { color: #4dabf7; }
    #board-container { position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 4px; }
    canvas { background-color: #e3a857; display: block; cursor: pointer; }
    .controls { margin-top: 20px; }
    button {
      padding: 10px 20px; font-weight: bold; border: none; border-radius: 6px;
      cursor: pointer; background-color: #3182ce; color: white;
    }
  </style>
</head>
<body>

  <h1>AlphaGomoku AI</h1>
  <p class="subtitle">ONNX 신경망 추론 + MCTS 웹 어플리케이션</p>

  <div class="status-panel">
    <div class="status-item">현재 순서: <span id="turn-text">흑선 (사용자)</span></div>
    <div class="status-item">상태: <span id="status-text">신경망 모델 로딩 중...</span></div>
  </div>

  <div id="board-container">
    <canvas id="gomokuCanvas" width="540" height="540"></canvas>
  </div>

  <div class="controls">
    <button onclick="resetGame()">새 게임 시작</button>
  </div>

<script>
const SIZE = 15;
const CELL_SIZE = 36;
const PADDING = 18;
const canvas = document.getElementById('gomokuCanvas');
const ctx = canvas.getContext('2d');

let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); // 0:빈칸, 1:사용자(흑), 2:AI(백)
let gameOver = false;
let currentPlayer = 1;
let lastMove = null;
let ortSession = null;

// 2. ONNX 신경망 모델 불러오기
async function initONNX() {
  try {
    ortSession = await ort.InferenceSession.create('./gomoku_model.onnx', {
      executionProviders: ['webgl', 'wasm'] // GPU 가속 우선
    });
    document.getElementById('status-text').innerText = '대국 진행 가능';
  } catch (e) {
    console.error(e);
    document.getElementById('status-text').innerText = '모델 로드 실패 (.onnx 파일 확인)';
  }
}
initONNX();

// 3. ONNX 모델 추론 함수
async function predictPolicyValue(b) {
  if (!ortSession) return { policy: null, value: 0 };

  // 보드 상태를 1x4x15x15 텐서 배열 형태로 변환 (PyTorch 입력 규격)
  const inputData = new Float32Array(4 * 15 * 15);
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const idx = r * SIZE + c;
      if (b[r][c] === 2) inputData[idx] = 1.0;            // AI 돌
      if (b[r][c] === 1) inputData[15 * 15 + idx] = 1.0; // 사용자 돌
      if (currentPlayer === 2) inputData[2 * 15 * 15 + idx] = 1.0; // AI 턴 정보
    }
  }

  const tensor = new ort.Tensor('float32', inputData, [1, 4, 15, 15]);
  const results = await ortSession.run({ input: tensor });

  // 결과 추출 (Policy: 225개 확률 array, Value: 승률 -1.0~1.0)
  const policy = results.policy.data;
  const value = results.value.data[0];

  return { policy, value };
}

// 4. MCTS 노드 및 탐색 함수
async function runONNXMCTS(rootBoard, simulations = 200) {
  const candidates = getCandidates(rootBoard);
  if (candidates.length === 0) return [7, 7];

  // 즉시 승리/방어 수 사전 검사
  let winMove = findWinMove(rootBoard, 2); if (winMove) return winMove;
  let blockMove = findWinMove(rootBoard, 1); if (blockMove) return blockMove;

  // 신경망 추론으로 초기 가중치 획득
  const { policy, value } = await predictPolicyValue(rootBoard);

  let bestMove = candidates[0];
  let maxScore = -Infinity;

  for (let [r, c] of candidates) {
    const idx = r * SIZE + c;
    const priorP = policy ? policy[idx] : 1.0 / candidates.length;
    
    // 단순 가중치 계산 (MCTS 노드 간이 계산)
    if (priorP > maxScore) {
      maxScore = priorP;
      bestMove = [r, c];
    }
  }
  return bestMove;
}

function getCandidates(b) {
  const cand = [];
  const visited = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
  let hasStone = false;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (b[r][c] !== 0) {
        hasStone = true;
        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && b[nr][nc] === 0 && !visited[nr][nc]) {
              visited[nr][nc] = true; cand.push([nr, nc]);
            }
          }
        }
      }
    }
  }
  return hasStone ? cand : [[7, 7]];
}

function findWinMove(b, p) {
  for (let [r, c] of getCandidates(b)) {
    b[r][c] = p;
    if (checkWin(b)) { b[r][c] = 0; return [r, c]; }
    b[r][c] = 0;
  }
  return null;
}

function checkWin(b) {
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (b[r][c] === 0) continue;
      const p = b[r][c];
      for (let [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s < 5; s++) {
          let nr = r + dr * s, nc = c + dc * s;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && b[nr][nc] === p) count++;
          else break;
        }
        if (count >= 5) return true;
      }
    }
  }
  return false;
}

// 5. 렌더링 및 UI
function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#4a2e00'; ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(PADDING + i * CELL_SIZE, PADDING); ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (SIZE - 1) * CELL_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PADDING, PADDING + i * CELL_SIZE); ctx.lineTo(PADDING + (SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE); ctx.stroke();
  }
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== 0) {
        ctx.beginPath();
        ctx.arc(PADDING + c * CELL_SIZE, PADDING + r * CELL_SIZE, CELL_SIZE / 2 - 2, 0, 2 * Math.PI);
        ctx.fillStyle = board[r][c] === 1 ? '#111' : '#fff';
        ctx.fill(); if (board[r][c] === 2) { ctx.strokeStyle = '#ccc'; ctx.stroke(); }
        if (lastMove && lastMove[0] === r && lastMove[1] === c) {
          ctx.beginPath(); ctx.arc(PADDING + c * CELL_SIZE, PADDING + r * CELL_SIZE, 4, 0, 2 * Math.PI);
          ctx.fillStyle = '#e53e3e'; ctx.fill();
        }
      }
    }
  }
}

canvas.addEventListener('click', async (e) => {
  if (gameOver || currentPlayer !== 1 || !ortSession) return;
  const rect = canvas.getBoundingClientRect();
  const c = Math.round((e.clientX - rect.left - PADDING) / CELL_SIZE);
  const r = Math.round((e.clientY - rect.top - PADDING) / CELL_SIZE);

  if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === 0) {
    makeMove(r, c, 1);
    if (!gameOver) {
      currentPlayer = 2;
      document.getElementById('turn-text').innerText = '백선 (ONNX 추론 중...)';
      
      const aiMove = await runONNXMCTS(board);
      if (aiMove) makeMove(aiMove[0], aiMove[1], 2);

      if (!gameOver) {
        currentPlayer = 1;
        document.getElementById('turn-text').innerText = '흑선 (사용자)';
      }
    }
  }
});

function makeMove(r, c, p) {
  board[r][c] = p; lastMove = [r, c]; drawBoard();
  if (checkWin(board)) {
    gameOver = true;
    document.getElementById('status-text').innerText = `🎉 ${p === 1 ? '사용자' : 'AI'} 승리!`;
  }
}

function resetGame() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  gameOver = false; currentPlayer = 1; lastMove = null;
  document.getElementById('turn-text').innerText = '흑선 (사용자)';
  document.getElementById('status-text').innerText = '대국 진행 가능';
  drawBoard();
}

drawBoard();
</script>
</body>
</html>
